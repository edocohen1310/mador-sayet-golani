<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>סיירת גולני — מדור לוחמה</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מדור לוחמה">
  <meta name="theme-color" content="#1E5128">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="shortcut icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EFEBE3;
      --card: #FFFFFF;
      --primary: #1E5128;
      --primary-dark: #123318;
      --primary-light: rgba(30,81,40,0.1);
      --accent: #B8941E;
      --accent-light: rgba(184,148,30,0.12);
      --brown: #7A5530;
      --text: #1A1812;
      --text-secondary: #524E49;
      --separator: #DDD8CE;
      --success: #1E5128;
      --warning: #B8941E;
      --danger: #B82020;
      --star: #B8941E;
      /* Elevation scale */
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --shadow:    0 1px 8px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-md: 0 2px 12px rgba(0,0,0,0.09), 0 1px 4px rgba(0,0,0,0.05);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
      /* Typography scale */
      --text-xs:   11px;
      --text-sm:   13px;
      --text-base: 15px;
      --text-md:   17px;
      --text-lg:   20px;
      --text-xl:   26px;
      /* Glass tokens */
      --glass-sm: rgba(255,255,255,0.08);
      --glass-md: rgba(255,255,255,0.15);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Rubik', -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
      padding-bottom: 80px;
    }

    /* ======== HEADER ======== */
    .header {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 20px;
      border-bottom: 1px solid var(--separator);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
    }
    .header-title { font-size: 17px; font-weight: 600; }
    .header-action {
      color: var(--primary);
      font-size: 15px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'Rubik', sans-serif;
      font-weight: 500;
      padding: 4px 0;
      -webkit-tap-highlight-color: transparent;
    }
    .header-action:active { opacity: 0.6; }

    /* ======== MAIN ======== */
    .main {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 24px;
    }

    /* ======== CARD ======== */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .card + .card { margin-top: 12px; }

    /* ======== SECTION TITLE ======== */
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 22px 0 8px 6px;
    }
    /* ======== COLLAPSIBLE CRITERION SECTIONS ======== */
    .crit-section { margin-bottom: 2px; }
    .section-collapse-header {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 6px 10px; cursor: pointer;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .section-toggle-icon {
      font-size: 13px; color: var(--text-secondary);
      transition: transform 0.22s cubic-bezier(0.2,0,0,1);
      display: inline-block; line-height: 1;
    }
    .crit-section.collapsed .section-toggle-icon { transform: rotate(-90deg); }
    .section-title-text {
      font-size: 12px; font-weight: 700; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.6px; flex: 1;
    }
    .section-progress-badge {
      font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      background: var(--bg); color: var(--text-secondary);
      transition: background 0.25s, color 0.25s, transform 0.2s;
      min-width: 32px; text-align: center;
    }
    .section-collapse-header.done .section-progress-badge {
      background: var(--success); color: white; transform: scale(1.08);
    }
    .section-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.28s cubic-bezier(0.2,0,0,1), opacity 0.22s ease;
      opacity: 1;
    }
    .section-body > * { overflow: hidden; }
    .crit-section.collapsed .section-body { grid-template-rows: 0fr; opacity: 0; }

    /* ======== BUTTONS ======== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px 24px;
      border-radius: var(--radius);
      font-family: 'Rubik', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, opacity 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }
    .btn:active { transform: scale(0.97); opacity: 0.88; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--primary-light); color: var(--primary); }
    .btn-ghost { background: var(--bg); color: var(--text); }
    .btn-danger { background: rgba(255,59,48,0.1); color: var(--danger); }
    .btn-sm { padding: 10px 18px; font-size: 14px; border-radius: var(--radius-sm); width: auto; }

    /* ======== FORM ======== */
    .form-row {
      padding: 14px 18px;
    }
    .form-row + .form-row { border-top: 1px solid var(--separator); }
    .form-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--separator);
      border-radius: var(--radius-sm);
      font-family: 'Rubik', sans-serif;
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .form-input:focus { border-color: var(--primary); background: white; }
    .form-textarea { resize: vertical; min-height: 72px; line-height: 1.5; }

    /* ======== SEGMENT CONTROL ======== */
    .segment-wrap { padding: 4px; background: var(--bg); border-radius: var(--radius-sm); display: flex; gap: 2px; }
    .seg-btn {
      flex: 1; padding: 9px 4px; border: none; border-radius: 8px; background: transparent;
      font-family: 'Rubik', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;
      color: var(--text-secondary); transition: all 0.18s; -webkit-tap-highlight-color: transparent;
    }
    .seg-btn.active { background: white; color: var(--text); font-weight: 600; box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
    .seg-btn:active { background: rgba(0,0,0,0.08); transform: scale(0.97); }

    /* ======== TERRAIN GRID ======== */
    .terrain-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .terrain-tile {
      display: flex; flex-direction: column; align-items: center; padding: 14px 8px 12px;
      border-radius: var(--radius); cursor: pointer; border: 2px solid transparent;
      transition: all 0.18s; background: var(--card); box-shadow: var(--shadow);
      -webkit-tap-highlight-color: transparent;
    }
    .terrain-tile.selected { border-color: var(--primary); background: rgba(0,122,255,0.06); }
    .terrain-tile:active { transform: scale(0.94); }
    .terrain-icon { width:30px; height:30px; margin-bottom: 6px; display:flex; align-items:center; justify-content:center; color: var(--text-secondary); }
    .terrain-tile.selected .terrain-icon { color: var(--primary); }
    .terrain-label { font-size: 12px; font-weight: 600; text-align: center; color: var(--text); }
    .terrain-tile.selected .terrain-label { color: var(--primary); }

    /* ======== STAR RATING ======== */
    .criterion-row {
      padding: 13px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .criterion-row + .criterion-row { border-top: 1px solid var(--separator); }
    .criterion-name { font-size: 14px; color: var(--text); flex: 1; line-height: 1.35; }
    .stars-row { display: flex; gap: 0; direction: ltr; flex-shrink: 0; align-items: center; }
    .star {
      font-size: 26px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; line-height: 1; user-select: none;
      padding: 9px 5px; margin: -9px -1px;
      transition: transform 0.18s cubic-bezier(0.2,0,0,1);
    }
    .star.on  { color: var(--star); }
    .star.off { color: #D1D1D6; }
    .star-label {
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      min-width: 26px; text-align: center; margin-right: 4px;
      opacity: 0; transition: opacity 0.2s;
    }
    .star-label.visible { opacity: 1; }
    @keyframes starPop {
      0%   { transform: scale(1);    }
      35%  { transform: scale(1.5);  }
      65%  { transform: scale(0.88); }
      82%  { transform: scale(1.1);  }
      100% { transform: scale(1);    }
    }
    .star.popping { animation: starPop 0.28s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    /* ======== PROGRESS BAR ======== */
    .progress-track { height: 3px; background: var(--separator); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.35s cubic-bezier(0.2,0,0,1); }
    .step-label { font-size: 12px; color: var(--text-secondary); text-align: center; margin-bottom: 20px; }

    /* ======== LEADERBOARD ======== */
    .lb-item { padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
    .lb-item + .lb-item { border-top: 1px solid var(--separator); }
    .rank-num {
      width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0;
    }
    .r1 { background: linear-gradient(135deg,#FFD700,#FFA500); color: #7A4400; }
    .r2 { background: linear-gradient(135deg,#C0C0C0,#A0A0A0); color: #3C3C3C; }
    .r3 { background: linear-gradient(135deg,#CD7F32,#A05A20); color: white; }
    .r-rest { background: var(--bg); color: var(--text-secondary); }
    .lb-info { flex: 1; min-width: 0; }
    .lb-name { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
    .bar-track { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.7s cubic-bezier(0.34,1.56,0.64,1); }
    .lb-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .lb-score { text-align: center; flex-shrink: 0; }
    .score-big { font-size: 28px; font-weight: 800; line-height: 1; }
    .score-unit { font-size: 11px; color: var(--text-secondary); }

    /* ======== HISTORY ITEM ======== */
    .hist-item {
      padding: 13px 18px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: background 0.12s; -webkit-tap-highlight-color: transparent;
    }
    .hist-item:active { background: var(--bg); }
    .hist-item + .hist-item { border-top: 1px solid var(--separator); }
    .hist-title { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
    .hist-sub { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .hist-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .hist-score { font-size: 22px; font-weight: 700; }
    .chevron { color: #C7C7CC; font-size: 16px; font-weight: 300; }

    /* ======== TEAM BADGE ======== */
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.2px;
    }
    .b-marom     { background: rgba(30,81,40,0.12);   color: #1E5128; }
    .b-sofer     { background: rgba(184,148,30,0.14); color: #8A6E14; }
    .b-yaakobson { background: rgba(122,85,48,0.12);  color: #7A5530; }

    /* ======== SCORE COLORS ======== */
    .c-high { color: var(--success); }
    .c-mid { color: var(--warning); }
    .c-low { color: var(--danger); }

    /* ======== EMPTY STATE ======== */
    .empty { text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.6; }
    .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .empty-text { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

    /* ======== TOAST ======== */
    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(28,28,30,0.92); color: white; padding: 12px 22px; border-radius: 22px;
      font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.25s, transform 0.25s;
      z-index: 9999; white-space: nowrap; pointer-events: none;
      box-shadow: var(--shadow-lg);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ======== DELETE DIALOG ======== */
    .delete-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 10000;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
      animation: fadeIn 0.2s ease;
    }
    .delete-sheet {
      background: white; border-radius: 18px 18px 0 0; padding: 24px 20px 16px;
      width: 100%; max-width: 480px;
      animation: slideUpSheet 0.28s cubic-bezier(0.05,0.7,0.1,1);
      box-shadow: var(--shadow-lg);
    }
    .delete-sheet-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .delete-sheet-sub { font-size: 14px; color: var(--text-secondary); text-align: center; margin-bottom: 20px; }
    .delete-sheet-btns { display: flex; flex-direction: column; gap: 10px; }
    @keyframes slideUpSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ======== BOTTOM NAV ======== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--separator);
      display: flex; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 4px 6px;
      cursor: pointer; color: var(--text-secondary); font-size: 10px; font-weight: 500;
      -webkit-tap-highlight-color: transparent; transition: color 0.15s;
      border: none; background: none; font-family: 'Rubik', sans-serif;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { display:flex; align-items:center; justify-content:center; margin-bottom:3px; width:22px; height:22px; }

    /* ======== BOTTOM ACTION BAR ======== */
    .action-bar {
      position: sticky; bottom: 0;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--separator);
      padding: 14px 20px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex; gap: 12px;
    }

    /* ======== SPINNER ======== */
    .spinner {
      width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: white; border-radius: 50%; animation: spin 0.75s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ======== LOADER ======== */
    .full-loader {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 9000; flex-direction: column; gap: 14px;
    }
    .full-loader-spin {
      width: 44px; height: 44px; border: 3px solid var(--separator);
      border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .full-loader-text { font-size: 14px; color: var(--text-secondary); }

    /* ======== NOTICE ======== */
    .notice {
      padding: 14px 16px; border-radius: var(--radius); margin-bottom: 16px;
      font-size: 13px; line-height: 1.6;
    }
    .notice-warning { background: rgba(255,149,0,0.1); border: 1px solid rgba(255,149,0,0.25); color: #9A5500; }
    .notice code { font-family: monospace; background: rgba(0,0,0,0.08); padding: 1px 5px; border-radius: 4px; }

    /* ======== DETAIL ======== */
    .detail-header-card { padding: 20px 18px; }
    .detail-score-badge {
      width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 28px; font-weight: 800; flex-shrink: 0;
    }
    .score-bg-high { background: rgba(52,199,89,0.12); }
    .score-bg-mid { background: rgba(255,149,0,0.12); }
    .score-bg-low { background: rgba(255,59,48,0.1); }

    /* ======== VIEW TRANSITIONS ======== */
    .view-forward { animation: viewForward 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both; }
    .view-back    { animation: viewBack    0.28s cubic-bezier(0.25,0.46,0.45,0.94) both; }
    .view-fade    { animation: viewFade    0.22s ease both; }
    @keyframes viewForward { from { opacity:0; transform:translateX(36px);  } to { opacity:1; transform:translateX(0); } }
    @keyframes viewBack    { from { opacity:0; transform:translateX(-36px); } to { opacity:1; transform:translateX(0); } }
    @keyframes viewFade    { from { opacity:0; transform:translateY(10px);  } to { opacity:1; transform:translateY(0); } }

    /* ======== STAGGER ENTRANCE ======== */
    @keyframes fadeSlideUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .si { animation: fadeSlideUp 0.32s ease both; }
    .si:nth-child(1){animation-delay:.03s} .si:nth-child(2){animation-delay:.07s}
    .si:nth-child(3){animation-delay:.11s} .si:nth-child(4){animation-delay:.15s}
    .si:nth-child(5){animation-delay:.19s} .si:nth-child(6){animation-delay:.23s}
    .si:nth-child(7){animation-delay:.27s} .si:nth-child(8){animation-delay:.31s}

    /* ======== SHAKE (VALIDATION ERROR) ======== */
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)}
    }
    .shake { animation: shake 0.36s ease !important; border-color: var(--danger) !important; }

    /* ======== RIPPLE ======== */
    .btn { position: relative; overflow: hidden; }
    .ripple {
      position:absolute; border-radius:50%; pointer-events:none;
      background:rgba(255,255,255,0.38); transform:scale(0);
      animation: rippleOut 0.2s cubic-bezier(0.2,0,0,1) forwards;
    }
    @keyframes rippleOut { to { transform:scale(4); opacity:0; } }

    /* ======== FOCUS VISIBLE ======== */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .form-input:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,81,40,0.2); }
    .star:focus-visible { outline-offset: 4px; border-radius: 2px; }

    /* ======== SUCCESS SCREEN ======== */
    .success-wrap {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:70vh; text-align:center; padding:40px 24px;
    }
    .success-circle {
      width:88px; height:88px; border-radius:50%;
      background:rgba(30,81,40,0.12); display:flex; align-items:center; justify-content:center;
      margin-bottom:24px; color:var(--primary);
      animation: checkBounce 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
    }
    .success-circle svg { width:42px; height:42px; stroke-width:2.5; }
    @keyframes checkBounce {
      0%   { transform:scale(0);    opacity:0; }
      55%  { transform:scale(1.18); opacity:1; }
      75%  { transform:scale(0.94); }
      88%  { transform:scale(1.06); }
      100% { transform:scale(1);    }
    }
    .success-title { font-size:26px; font-weight:700; margin-bottom:8px; animation:viewFade 0.4s 0.3s both; }
    .success-sub   { font-size:15px; color:var(--text-secondary); animation:viewFade 0.4s 0.45s both; }
    .success-score { font-size:56px; font-weight:800; margin:20px 0 4px; animation:checkBounce 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.5s both; }
    .success-score-label { font-size:13px; color:var(--text-secondary); animation:viewFade 0.4s 0.7s both; }
    .success-progress {
      position:fixed; bottom:0; left:0; right:0; height:3px;
      background:var(--primary); width:0%;
      transition: width 4s linear;
    }

    /* ======== STAR HOVER ======== */
    .star.preview { color: var(--star); opacity: 0.5; transition: opacity 0.08s ease; }

    /* ======== LEADERBOARD BAR (animated via JS) ======== */
    .bar-fill { transition: width 0.75s cubic-bezier(0.34,1.56,0.64,1); }

// ============================================================
// DATA
// ============================================================
function sanitizeEval(ev) {
  if (!ev || typeof ev !== 'object') return ev;
  const cleanScores = {};
  if (ev.scores && typeof ev.scores === 'object') {
    for (const k in ev.scores) {
      const safe = String(k).replace(/[\.\$\#\[\]\/]/g, ' ').replace(/\s+/g, ' ').trim();
      if (safe) cleanScores[safe] = ev.scores[k];
    }
  }
  return { ...ev, scores: cleanScores };
}

async function loadData(silent = false) {
  let local = JSON.parse(localStorage.getItem('evals_v2') || '[]');
  // ניקוי חד-פעמי של מפתחות אסורים בהערכות ישנות
  local = local.map(sanitizeEval);
  localStorage.setItem('evals_v2', JSON.stringify(local));
  S.evaluations = local;
  S.loading = false;
  if (!silent) render();

  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 7000);
    const res = await fetch(FIREBASE_URL + '/evaluations.json', { signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error('Firebase HTTP ' + res.status);
    const data = await res.json();
    const rows = (data && typeof data === 'object' && !data.error)
      ? Object.values(data).filter(r => r && typeof r === 'object' && r.id && r.team && r.exerciseName)
      : [];
    const remote = rows.map(r => ({
      ...r,
      scores: typeof r.scores === 'string' ? JSON.parse(r.scores || '{}') : (r.scores || {}),
    }));
    // מיזוג: remote + כל מקומי שאינו ב-remote
    const remoteIds = new Set(remote.map(r => r.id));
    const localOnly = local.filter(l => l.id && l.team && l.exerciseName && !remoteIds.has(l.id));
    const merged = [...remote, ...localOnly];
    S.evaluations = merged;
    localStorage.setItem('evals_v2', JSON.stringify(merged));

    // סנכרון: העלה ל-Firebase כל הערכה מקומית שעוד לא שם
    for (const ev of localOnly) {
      try {
        await fetch(FIREBASE_URL + '/evaluations.json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ev),
        });
      } catch (err) {
        console.warn('Firebase sync failed for', ev.id, err);
      }
    }
  } catch (e) {
    console.warn('Firebase load failed:', e);
    if (!silent) toast('הנתונים נטענו מהמכשיר בלבד');
  }
  if (!silent) render();
}


async function saveEval(ev) {
  const clean = sanitizeEval(ev);
  // שמירה מקומית
  const arr = JSON.parse(localStorage.getItem('evals_v2') || '[]');
  arr.push(clean);
  localStorage.setItem('evals_v2', JSON.stringify(arr));
  S.evaluations = arr;

  // שמירה ל-Firebase
  try {
    await fetch(FIREBASE_URL + '/evaluations.json', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(clean),
    });
  } catch (e) {
    console.warn('Firebase save failed:', e);
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function avg(scores) {
  const vals = Object.values(scores).filter(v => v > 0);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
}

function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function scoreClass(v) {
  const n = parseFloat(v);
  return n >= 4 ? 'c-high' : n >= 3 ? 'c-mid' : n > 0 ? 'c-low' : '';
}

function scoreBgClass(v) {
  const n = parseFloat(v);
  return n >= 4 ? 'score-bg-high' : n >= 3 ? 'score-bg-mid' : 'score-bg-low';
}

function teamBadge(team) {
  const m = TEAM_META[team] || {};
  return `<span class="badge ${m.cls || ''}">${team}</span>`;
}

function teamStats() {
  return TEAMS.map(team => {
    const evs = S.evaluations.filter(e => e.team === team);
    const a = evs.length ? evs.reduce((s, e) => s + parseFloat(e.avgScore || 0), 0) / evs.length : 0;
    return { team, avg: a, count: evs.length };
  }).sort((a, b) => b.avg - a.avg);
}

function recentForTeam(team, n = 3) {
  return S.evaluations
    .filter(e => e.team === team)
    .sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date))
    .slice(0, n);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

function render() {
  const app = document.getElementById('app');

  if (S.loading) {
    app.innerHTML = `
      <div class="full-loader">
        <div class="full-loader-spin"></div>
        <div class="full-loader-text">טוען נתונים...</div>
      </div>`;
    return;
  }

  const viewClass = `view-${S.direction}`;
  let html = '';
  switch (S.view) {
    case 'dashboard':        html = vDashboard(viewClass);       break;
    case 'new-eval':         html = vNewEval(viewClass);          break;
    case 'history':          html = vHistory(viewClass);          break;
    case 'detail':           html = vDetail(viewClass);           break;
    case 'success':          html = vSuccess(viewClass);          break;
    case 'team-view':        html = vTeamView(viewClass);         break;
    case 'exercise-compare': html = vExerciseCompare(viewClass);  break;
  }
  if (S.view !== 'new-eval' && S.view !== 'success') {
    html += vNav();
  }
  app.innerHTML = html;
  attachAll();
  animateBars();
  countUpScores();
  setupRipples();
  if (S.view === 'success') {
    const target = parseFloat((S.successData || {}).avgScore || 0) * 20;
    setTimeout(() => {
      const el = document.getElementById('success-score-num');
      if (!el) return;
      const dur = 1200, start = performance.now();
      const tick = now => {
        const p = Math.min((now - start) / dur, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * ease);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }, 500);
  }
}

// animate leaderboard bars: start at 0 → target via CSS transition
function animateBars() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill[data-w]').forEach((el, i) => {
      setTimeout(() => { el.style.width = el.dataset.w; }, i * 80);
    });
  });
}

// count-up animation for .score-count elements
function countUpScores() {
  document.querySelectorAll('.score-count').forEach(el => {
    const target = parseFloat(el.dataset.target);
    if (!target) return;
    const dur = 800, start = performance.now();
    const tick = now => {
      const p = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * ease);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function setupRipples() {
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      btn.appendChild(r);
      setTimeout(() => r.remove(), 300);
    });
  });
}

const HAPTIC = {
  light:   [8],
  medium:  [10],
  back:    [6],
  star:    [10],
  success: [8, 100, 12],
  warning: [8, 40, 8],
};
function haptic(type = 'medium') {
  try {
    const p = typeof type === 'number' ? [type]
            : Array.isArray(type) ? type
            : HAPTIC[type] ?? [8];
    navigator.vibrate?.(p);
  } catch(_) {}
}

function shakeEl(el) {
  if (!el) return;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 400);
}

function vStep2() {
  const f = S.form;
  const terrainCriteria = TERRAIN_CRITERIA[f.terrainType] || [];
  const allSections = [
    ...Object.entries(UNIVERSAL),
    ...(terrainCriteria.length ? [[`ספציפי — ${f.terrainType}`, terrainCriteria]] : [])
  ];
  return allSections.map(([title, criteria], i) => {
    const secId = 'sec' + i;
    const scored = criteria.filter(c => (f.scores[c] || 0) > 0).length;
    const total = criteria.length;
    const done = scored === total && total > 0;
    return `
      <div class="crit-section" data-section-id="${secId}">
        <div class="section-collapse-header ${done ? 'done' : ''}" data-toggle="${secId}">
          <span class="section-toggle-icon">▾</span>
          <span class="section-title-text">${title}</span>
          <span class="section-progress-badge" id="prog-${secId}">${done ? '✓' : scored + '/' + total}</span>
        </div>
        <div class="section-body" id="body-${secId}">
          <div class="card">${criteria.map(c => criterionRow(c, f.scores[c] || 0)).join('')}</div>
        </div>
      </div>`;
  }).join('');
}

function updateSectionProgress() {
  document.querySelectorAll('.crit-section').forEach(sec => {
    const secId = sec.dataset.sectionId;
    const body = document.getElementById('body-' + secId);
    if (!body) return;
    const rows = body.querySelectorAll('.stars-row');
    const total = rows.length;
    const scored = [...rows].filter(row => (S.form.scores[row.dataset.crit] || 0) > 0).length;
    const badge = document.getElementById('prog-' + secId);
    const header = sec.querySelector('.section-collapse-header');
    if (scored === total && total > 0) {
      if (badge) badge.textContent = '✓';
      if (header) header.classList.add('done');
      if (!sec.classList.contains('collapsed')) {
        setTimeout(() => { sec.classList.add('collapsed'); haptic('light'); }, 500);
      }
    } else {
      if (badge) badge.textContent = scored + '/' + total;
      if (header) header.classList.remove('done');
    }
  });
}

function criterionRow(c, score) {
  const ec = esc(c);
  const stars = [1,2,3,4,5].map(n =>
    `<span class="star ${n <= score ? 'on' : 'off'}" data-val="${n}" data-criterion="${ec}" role="radio" aria-checked="${n === score}" aria-label="${n} כוכבים" tabindex="${n === 1 ? '0' : '-1'}">★</span>`
  ).join('');
  const lbl = score > 0 ? score + '/5' : '';
  return `
    <div class="criterion-row">
      <div class="criterion-name" id="crit-lbl-${ec}">${c}</div>
      <div style="display:flex;align-items:center;gap:2px;flex-shrink:0">
        <span class="star-label ${score > 0 ? 'visible' : ''}" id="lbl-${ec}">${lbl}</span>
        <div class="stars-row" data-crit="${ec}" role="radiogroup" aria-labelledby="crit-lbl-${ec}">${stars}</div>
      </div>
    </div>`;
}

function vTeamView(vc = 'view-forward') {
  const team = S.teamFilter;
  const evs = S.evaluations.filter(e => e.team === team);
  const byEx = {};
  evs.forEach(e => {
    if (!byEx[e.exerciseName]) byEx[e.exerciseName] = [];
    byEx[e.exerciseName].push(e);
  });
  const exercises = Object.entries(byEx).sort((a, b) => {
    const lastA = Math.max(...a[1].map(x => new Date(x.timestamp || x.date)));
    const lastB = Math.max(...b[1].map(x => new Date(x.timestamp || x.date)));
    return lastB - lastA;
  });
  const color = TEAM_META[team]?.color || 'var(--primary)';
  return `
    <div class="${vc}">
      <div class="header" style="background:var(--primary);border-bottom:none;">
        <button class="header-action" id="btn-back-team" style="color:rgba(255,255,255,0.8);">‹ חזור</button>
        <div style="display:flex;align-items:center;gap:8px;">

          <div class="header-title" style="color:white;">צוות ${team}</div>
        </div>
        <div style="width:64px"></div>
      </div>
      <div class="main">
        <div class="section-title">תרגילים (${exercises.length})</div>
        ${exercises.length === 0 ? '<div class="card"><div class="form-row" style="color:var(--text-secondary);text-align:center">אין הערכות לצוות זה</div></div>' : `
        <div class="card">
          ${exercises.map(([name, list]) => {
            const avgAll = list.reduce((s, e) => s + parseFloat(e.avgScore || 0), 0) / list.length;
            const coaches = [...new Set(list.map(e => e.coachName).filter(Boolean))].join(', ');
            return `
              <div class="hist-item si" data-exercise="${esc(name)}" style="cursor:pointer;">
                <div style="flex:1;min-width:0">
                  <div class="hist-title">${name}</div>
                  <div class="hist-sub">
                    <span>${list[0]?.terrainType || ''}</span>
                    ${coaches ? `<span>${coaches}</span>` : ''}

                  </div>
                </div>
                <div class="hist-right">
                  <span class="hist-score ${scoreClass(avgAll)}">${(avgAll * 20).toFixed(0)}</span>
                  <span class="chevron">›</span>
                </div>
              </div>`;
          }).join('')}
        </div>`}
      </div>
    </div>`;
}

function vExerciseCompare(vc = 'view-forward') {
  const name = S.exerciseFilter;
  const evs = S.evaluations.filter(e => e.exerciseName === name);
  const byTeam = {};
  evs.forEach(e => {
    if (!byTeam[e.team]) byTeam[e.team] = [];
    byTeam[e.team].push(e);
  });
  const teams = Object.entries(byTeam).map(([team, list]) => {
    const avg = list.reduce((s, e) => s + parseFloat(e.avgScore || 0), 0) / list.length;
    return { team, list, avg };
  }).sort((a, b) => b.avg - a.avg);

  // Collect all criteria across all evals for this exercise
  const allCriteria = evs.length ? Object.keys(evs[0].scores || {}) : [];

  return `
    <div class="${vc}">
      <div class="header" style="background:var(--primary);border-bottom:none;">
        <button class="header-action" id="btn-back-exercise" style="color:rgba(255,255,255,0.8);">‹ חזור</button>
        <div style="display:flex;align-items:center;gap:7px;">
          <img src="סמלים/saieret_nobg.png" style="height:24px;filter:brightness(0) invert(1);opacity:0.8;">
          <div class="header-title" style="color:white;font-size:14px;text-align:center;">${name}</div>
        </div>
        <div style="width:64px"></div>
      </div>
      <div class="main">
        <div class="section-title">השוואת צוותים</div>
        <div class="card">
          ${teams.map((t, i) => {
            const pct = (t.avg / 5 * 100).toFixed(1);
            const color = TEAM_META[t.team]?.color || '#888';
            return `
              <div class="lb-item si">
                <div class="rank-num ${['r1','r2','r3'][i] || 'r-rest'}">${i + 1}</div>
                <div class="lb-info">
                  <div class="lb-name">${t.team}</div>
                  <div class="bar-track">
                    <div class="bar-fill" data-w="${pct}%" style="width:0%;background:${color}"></div>
                  </div>
                  <div class="lb-meta">${t.list.length} הערכות · ${t.list.map(e => e.coachName).join(', ')}</div>
                </div>
                <div class="lb-score">
                  <div class="score-big ${scoreClass(t.avg)}">${(t.avg * 20).toFixed(0)}</div>
                  <div class="score-unit">מתוך 100</div>
                </div>
              </div>`;
          }).join('')}
          ${teams.length === 0 ? '<div class="form-row" style="color:var(--text-secondary);text-align:center">אין נתונים</div>' : ''}
        </div>

        ${allCriteria.length > 0 ? `
          <div class="section-title">פירוט קריטריונים</div>
          <div class="card">
            ${allCriteria.map(c => {
              const teamScores = teams.map(t => {
                const scores = t.list.map(e => (e.scores || {})[c] || 0);
                const avg = scores.reduce((a, b) => a + b, 0) / (scores.length || 1);
                return { team: t.team, avg, color: TEAM_META[t.team]?.color || '#888' };
              });
              return `
                <div class="criterion-row" style="flex-direction:column;align-items:flex-start;gap:6px;padding:10px 16px;">
                  <div class="criterion-name" style="font-size:13px">${c}</div>
                  <div style="display:flex;gap:10px;width:100%">
                    ${teamScores.map(ts => `
                      <div style="flex:1;text-align:center;">
                        <div style="font-size:11px;color:var(--text-secondary);margin-bottom:3px">${ts.team}</div>
                        <div style="font-size:16px;font-weight:600;color:${ts.color}">${ts.avg.toFixed(1)}</div>
                      </div>`).join('')}
                  </div>
                </div>`;
            }).join('')}
          </div>` : ''}

        ${teams.some(t => t.list.some(e => e.preserve1 || e.preserve2 || e.improve1 || e.improve2 || e.notes)) ? `
          <div class="section-title">שימור, שיפור ודגשים</div>
          ${teams.map(t => {
            const relevant = t.list.filter(e => e.preserve1 || e.preserve2 || e.improve1 || e.improve2 || e.notes);
            if (!relevant.length) return '';
            const color = TEAM_META[t.team]?.color || 'var(--primary)';
            return `
              <div class="section-title" style="color:${color};margin-top:10px">צוות ${t.team}</div>
              <div class="card">
                ${relevant.map(e => `
                  ${e.coachName ? `<div class="form-row" style="font-size:11px;color:var(--text-secondary);padding-bottom:0">${e.coachName} · ${fmtDate(e.date)}</div>` : ''}
                  ${(e.preserve1 || e.preserve2) ? `
                    <div class="form-row" style="padding-bottom:4px">
                      <div style="font-size:11px;font-weight:600;color:var(--success);margin-bottom:4px;display:flex;align-items:center;gap:4px;">${ICONS.check} שימור</div>
                      ${e.preserve1 ? `<div style="font-size:14px;line-height:1.5;color:var(--text)">${e.preserve1}</div>` : ''}
                      ${e.preserve2 ? `<div style="font-size:14px;line-height:1.5;color:var(--text);margin-top:3px">${e.preserve2}</div>` : ''}
                    </div>` : ''}
                  ${(e.improve1 || e.improve2) ? `
                    <div class="form-row" style="padding-bottom:4px;border-top:1px solid var(--separator)">
                      <div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:4px;">${ICONS.arrowUp} שיפור</div>
                      ${e.improve1 ? `<div style="font-size:14px;line-height:1.5;color:var(--text)">${e.improve1}</div>` : ''}
                      ${e.improve2 ? `<div style="font-size:14px;line-height:1.5;color:var(--text);margin-top:3px">${e.improve2}</div>` : ''}
                    </div>` : ''}
                  ${e.notes ? `
                    <div class="form-row" style="border-top:1px solid var(--separator)">
                      <div style="font-size:11px;font-weight:600;color:var(--brown);margin-bottom:4px">דגשים נוספים</div>
                      <div style="font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap">${e.notes}</div>
                    </div>` : ''}
                `).join('')}
              </div>`;
          }).join('')}` : ''}
      </div>
    </div>`;
}

        </div>
        <div class="success-circle" style="background:rgba(30,81,40,0.12);color:var(--primary)">${ICONS.check}</div>
        <div class="success-title">ההערכה נשמרה!</div>
        <div class="success-sub">${d.exerciseName || ''} · ${d.team || ''}</div>
        <div class="success-score ${scoreClass(a)}"><span id="success-score-num">0</span></div>
        <div class="success-score-label">ציון מתוך 100</div>
        <div style="margin-top:18px;font-size:15px;font-weight:600;color:var(--primary);text-align:center;line-height:1.6;animation:viewFade 0.4s 0.85s both;">
          לכל מקום שנרצה, בכל דרך שנבחר
        </div>
        <button id="btn-success-continue" class="btn btn-primary" style="margin-top:22px;animation:viewFade 0.4s 0.9s both;">
          ← לדשבורד
        </button>
      </div>
      <div class="success-progress" id="success-progress"></div>
    </div>`;
}

// ============================================================
// DETAIL
// ============================================================
function vDetail(vc = 'view-forward') {
  const e = S.evaluations.find(x => x.id === S.detailId);
  if (!e) return '<div class="main"><p style="padding:20px">לא נמצא</p></div>';
  const scores = e.scores || {};
  const a = parseFloat(e.avgScore || 0);
  const color = TEAM_META[e.team]?.color || '#888';

  return `
    <div class="${vc}">
      <div class="header" style="background:var(--primary);border-bottom:none;">
        <button class="header-action" id="btn-back-detail" style="color:rgba(255,255,255,0.8);">‹ חזור</button>
        <div style="display:flex;align-items:center;gap:7px;">
          <img src="סמלים/saieret_nobg.png" style="height:26px;filter:brightness(0) invert(1);opacity:0.8;">
          <div class="header-title" style="color:white;">פרטי הערכה</div>
        </div>
        <div style="width:64px"></div>
      </div>
      <div class="main">
        <div class="card">
          <div class="detail-header-card" style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;font-weight:700;margin-bottom:5px;line-height:1.3">${e.exerciseName}</div>
              <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">${e.coachName} · ${fmtDate(e.date)}</div>
              ${teamBadge(e.team)}
              <span style="font-size:13px;color:var(--text-secondary);margin-right:6px">${e.terrainType}</span>
            </div>
            <div class="detail-score-badge ${scoreBgClass(a)}" style="color:${a >= 4 ? 'var(--success)' : a >= 3 ? 'var(--warning)' : 'var(--danger)'}" aria-label="ציון: ${(a*20).toFixed(0)} מתוך 100">
              ${(a*20).toFixed(0)}
            </div>
          </div>
        </div>

        ${Object.keys(scores).length > 0 ? `
          <div class="section-title">ציונים</div>
          <div class="card">
            ${Object.entries(scores).map(([k, v]) => `
              <div class="criterion-row">
                <div class="criterion-name">${k}</div>
                <div class="stars-row">
                  ${[1,2,3,4,5].map(n => `<span class="star ${n <= v ? 'on' : 'off'}" style="cursor:default;font-size:20px">★</span>`).join('')}
                </div>
              </div>`).join('')}
          </div>` : ''}

        ${(e.preserve1 || e.preserve2) ? `
          <div class="section-title" style="display:flex;align-items:center;gap:6px;"><span style="color:var(--success)">${ICONS.check}</span> נקודות שימור</div>
          <div class="card">
            ${e.preserve1 ? `<div class="form-row" style="font-size:15px;line-height:1.6">${e.preserve1}</div>` : ''}
            ${e.preserve2 ? `<div class="form-row" style="font-size:15px;line-height:1.6;border-top:1px solid var(--separator)">${e.preserve2}</div>` : ''}
          </div>` : ''}

        ${(e.improve1 || e.improve2) ? `
          <div class="section-title" style="display:flex;align-items:center;gap:6px;"><span style="color:var(--accent)">${ICONS.arrowUp}</span> נקודות שיפור</div>
          <div class="card">
            ${e.improve1 ? `<div class="form-row" style="font-size:15px;line-height:1.6">${e.improve1}</div>` : ''}
            ${e.improve2 ? `<div class="form-row" style="font-size:15px;line-height:1.6;border-top:1px solid var(--separator)">${e.improve2}</div>` : ''}
          </div>` : ''}

        ${e.notes ? `
          <div class="section-title">התייחסות חופשית</div>
          <div class="card">
            <div class="form-row" style="font-size:15px;line-height:1.7;white-space:pre-wrap">${e.notes}</div>
          </div>` : ''}

        <div style="margin-top:24px">
          <button class="btn btn-danger" id="btn-delete" style="display:flex;align-items:center;justify-content:center;gap:8px;">${ICONS.trash} מחק הערכה</button>
        </div>
      </div>
    </div>`;
}

// ============================================================
// ESCAPE
// ============================================================
function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
// HANDLERS
// ============================================================
function attachDetailListeners() {
  document.querySelectorAll('[data-detail]').forEach(el =>
    el.addEventListener('click', () => {
      S.prevView = S.view; S.detailId = el.dataset.detail;
      S.direction = 'forward'; S.view = 'detail'; render(); scrollTo(0,0);
    })
  );
}

function attachAll() {
  // Nav
  document.querySelectorAll('[data-nav]').forEach(el =>
    el.addEventListener('click', () => { S.direction = 'fade'; S.view = el.dataset.nav; render(); })
  );

  // New eval
  document.getElementById('btn-refresh')?.addEventListener('click', () => {
    haptic('medium'); loadData(false);
  });

  document.getElementById('btn-new')?.addEventListener('click', () => {
    haptic('medium'); S.direction = 'forward'; S.view = 'new-eval'; S.step = 1; S.form = freshForm(); render(); scrollTo(0,0);
  });

  // Back
  document.getElementById('btn-back')?.addEventListener('click', () => {
    haptic(6);
    if (S.step > 1) { saveStepData(); S.direction = 'back'; S.step--; render(); scrollTo(0,0); }
    else { S.direction = 'back'; S.view = 'dashboard'; render(); }
  });
  // Collapsible criterion sections
  document.querySelectorAll('[data-toggle]').forEach(el =>
    el.addEventListener('click', () => {
      haptic('light');
      const sec = document.querySelector(`[data-section-id="${el.dataset.toggle}"]`);
      if (sec) {
        sec.classList.toggle('collapsed');
        el.setAttribute('aria-expanded', !sec.classList.contains('collapsed'));
      }
    })
  );

  document.getElementById('btn-success-continue')?.addEventListener('click', () => {
    clearTimeout(S._successTimer);
    haptic('medium'); S.direction = 'fade'; S.view = 'dashboard'; render();
  });

  document.getElementById('btn-back-detail')?.addEventListener('click', () => {
    haptic('back'); S.direction = 'back'; S.view = S.prevView || 'dashboard'; render(); scrollTo(0,0);
  });

  // Team selector
  document.querySelectorAll('[data-team]').forEach(el =>
    el.addEventListener('click', () => {
      haptic('light'); saveStepData();
      S.form.team = el.dataset.team;
      document.querySelectorAll('[data-team]').forEach(b => b.classList.toggle('active', b.dataset.team === S.form.team));
      const rw = document.getElementById('s1-recent-wrap');
      if (rw) { rw.innerHTML = s1RecentHtml(); attachDetailListeners(); }
    })
  );

  // Terrain selector
  const selectTerrain = (terrain) => {
    haptic('light'); saveStepData();
    S.form.terrainType = terrain;
    S.form.exerciseName = '';
    document.querySelectorAll('[data-terrain]').forEach(t => {
      const isSelected = t.dataset.terrain === S.form.terrainType;
      t.classList.toggle('selected', isSelected);
      t.setAttribute('aria-checked', isSelected);
    });
    const ew = document.getElementById('s1-ex-wrap');
    if (ew) ew.innerHTML = s1ExerciseHtml();
  };
  document.querySelectorAll('[data-terrain]').forEach(el => {
    el.addEventListener('click', () => selectTerrain(el.dataset.terrain));
    el.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        selectTerrain(el.dataset.terrain);
      }
    });
  });

  // Stars — click + touch + hover preview
  document.querySelectorAll('.star[data-criterion]').forEach(el => {
    // iOS press feedback — instantaneous (0ms)
    el.addEventListener('touchstart', () => {
      el.style.transform = 'scale(0.82)';
    }, { passive: true });
    el.addEventListener('touchend', () => {
      el.style.transform = '';
    }, { passive: true });

    // click
    el.addEventListener('click', () => {
      const crit = el.dataset.criterion;
      const val  = parseInt(el.dataset.val);
      const prev = S.form.scores[crit] || 0;
      // #5 haptic: first rating vs change
      haptic(prev === 0 ? 'medium' : 'star');
      // #2 reset: tap same star again → clear to 0
      const newVal = (prev === val) ? 0 : val;
      S.form.scores[crit] = newVal;
      const row = el.closest('[data-crit]');
      if (row) {
        row.querySelectorAll('.star').forEach(s => {
          s.classList.remove('on','off','preview');
          s.classList.add(parseInt(s.dataset.val) <= newVal ? 'on' : 'off');
        });
        // #6 spring pop animation
        el.classList.remove('popping');
        void el.offsetWidth; // force reflow
        el.classList.add('popping');
        setTimeout(() => el.classList.remove('popping'), 280);
        // #4 update numeric label
        const lbl = document.getElementById('lbl-' + esc(crit));
        if (lbl) {
          lbl.textContent = newVal > 0 ? newVal + '/5' : '';
          lbl.classList.toggle('visible', newVal > 0);
        }
      }
      updateSectionProgress();
    });
    // hover preview
    el.addEventListener('mouseenter', () => {
      const val = parseInt(el.dataset.val);
      const row = el.closest('[data-crit]');
      const saved = S.form.scores[el.dataset.criterion] || 0;
      if (row) row.querySelectorAll('.star').forEach(s => {
        const sv = parseInt(s.dataset.val);
        s.classList.remove('on','off','preview');
        if (sv <= saved) s.classList.add('on');
        else if (sv <= val) s.classList.add('preview');
        else s.classList.add('off');
      });
    });
    el.addEventListener('mouseleave', () => {
      const row = el.closest('[data-crit]');
      const saved = S.form.scores[el.dataset.criterion] || 0;
      if (row) row.querySelectorAll('.star').forEach(s => {
        s.classList.remove('on','off','preview');
        s.classList.add(parseInt(s.dataset.val) <= saved ? 'on' : 'off');
      });
    });
  });

  // Next
  document.getElementById('btn-next')?.addEventListener('click', () => {
    if (!validateStep()) return;
    haptic('medium');
    saveStepData();
    S.direction = 'forward'; S.step++;
    render(); scrollTo(0,0);
  });

  // Submit
  document.getElementById('btn-submit')?.addEventListener('click', async () => {
    S.form.preserve = [
      document.getElementById('p0')?.value.trim() || '',
      document.getElementById('p1')?.value.trim() || '',
    ];
    S.form.improve = [
      document.getElementById('i0')?.value.trim() || '',
      document.getElementById('i1')?.value.trim() || '',
    ];
    S.form.notes = document.getElementById('f-notes')?.value.trim() || '';
    const a = avg(S.form.scores);
    const ev = {
      id: uid(),
      timestamp: new Date().toISOString(),
      coachName:    S.form.coachName,
      exerciseName: S.form.exerciseName,
      team:         S.form.team,
      terrainType:  S.form.terrainType,
      date:         S.form.date,
      scores:       S.form.scores,
      preserve1:    S.form.preserve[0],
      preserve2:    S.form.preserve[1],
      improve1:     S.form.improve[0],
      improve2:     S.form.improve[1],
      notes:        S.form.notes,
      avgScore:     a.toFixed(2),
    };
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> שומר הערכה...';
    haptic('success');
    await saveEval(ev);
    S.successData = ev;
    S.direction = 'forward'; S.view = 'success'; render();
    setTimeout(() => haptic('light'), 650);
    requestAnimationFrame(() => {
      const bar = document.getElementById('success-progress');
      if (bar) requestAnimationFrame(() => { bar.style.width = '100%'; });
    });
    S._successTimer = setTimeout(() => { S.direction = 'fade'; S.view = 'dashboard'; render(); }, 4000);
  });

  // Detail click (from history / dashboard)
  document.querySelectorAll('[data-detail]').forEach(el =>
    el.addEventListener('click', () => {
      S.prevView = S.view;
      S.detailId = el.dataset.detail;
      S.direction = 'forward'; S.view = 'detail';
      render(); scrollTo(0,0);
    })
  );

  // Team view back
  document.getElementById('btn-back-team')?.addEventListener('click', () => {
    haptic('back'); S.direction = 'back'; S.view = 'dashboard'; render(); scrollTo(0,0);
  });

  // Exercise compare back
  document.getElementById('btn-back-exercise')?.addEventListener('click', () => {
    haptic('back'); S.direction = 'back'; S.view = S.prevView || 'dashboard'; render(); scrollTo(0,0);
  });

  // Team name click (from leaderboard)
  document.querySelectorAll('[data-team-filter]').forEach(el =>
    el.addEventListener('click', e => {
      e.stopPropagation();
      haptic('light');
      S.teamFilter = el.dataset.teamFilter;
      S.prevView = S.view;
      S.direction = 'forward'; S.view = 'team-view'; render(); scrollTo(0,0);
    })
  );

  // Exercise click (from coach view)
  document.querySelectorAll('[data-exercise]').forEach(el =>
    el.addEventListener('click', () => {
      S.exerciseFilter = el.dataset.exercise;
      S.prevView = S.view;
      S.direction = 'forward'; S.view = 'exercise-compare'; render(); scrollTo(0,0);
    })
  );

  // Delete
  document.getElementById('btn-delete')?.addEventListener('click', () => {
    haptic('warning');
    const evalName = S.evaluations.find(e => e.id === S.detailId)?.exerciseName || 'הערכה זו';
    const trashSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>`;
    const overlay = document.createElement('div');
    overlay.className = 'delete-overlay';
    overlay.innerHTML = `
      <div class="delete-sheet" role="dialog" aria-modal="true" aria-labelledby="del-title">
        <div class="delete-sheet-title" id="del-title">מחיקת הערכה</div>
        <div class="delete-sheet-sub">"${evalName}" תימחק לצמיתות ולא ניתן יהיה לשחזר אותה</div>
        <div class="delete-sheet-btns">
          <button id="btn-delete-confirm" class="btn btn-danger" style="font-size:16px;display:flex;align-items:center;gap:8px;">${trashSvg} מחק הערכה</button>
          <button id="btn-delete-cancel" class="btn" style="background:var(--bg);font-size:16px;">ביטול</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const closeOverlay = () => { haptic('back'); overlay.remove(); document.removeEventListener('keydown', escHandler); };
    const escHandler = e => { if (e.key === 'Escape') closeOverlay(); };
    document.addEventListener('keydown', escHandler);

    requestAnimationFrame(() => overlay.querySelector('#btn-delete-cancel')?.focus());

    overlay.querySelector('#btn-delete-cancel').addEventListener('click', closeOverlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });

    overlay.querySelector('#btn-delete-confirm').addEventListener('click', async () => {
      haptic('warning');
      document.removeEventListener('keydown', escHandler);
      overlay.remove();
      const idToDelete = S.detailId;
      S.evaluations = S.evaluations.filter(e => e.id !== idToDelete);
      localStorage.setItem('evals_v2', JSON.stringify(S.evaluations));
      toast('ההערכה נמחקה');
      S.direction = 'back'; S.view = S.prevView || 'dashboard'; render();
      try {
        const res = await fetch(FIREBASE_URL + '/evaluations.json');
        if (res.ok) {
          const data = await res.json();
          if (data && typeof data === 'object') {
            const keys = Object.keys(data).filter(k => data[k] && data[k].id === idToDelete);
            for (const k of keys) await fetch(FIREBASE_URL + '/evaluations/' + k + '.json', { method: 'DELETE' });
          }
        }
      } catch (e) { console.warn('Firebase delete failed:', e); }
    });
  });
}

function saveStepData() {
  if (S.step === 1) {
    S.form.coachName    = document.getElementById('f-coach')?.value.trim() || '';
    S.form.exerciseName = document.getElementById('f-exercise')?.value.trim() || '';
    S.form.date         = document.getElementById('f-date')?.value || S.form.date;
  }
}

function validateStep() {
  if (S.step === 1) {
    const coachEl = document.getElementById('f-coach');
    const exEl    = document.getElementById('f-exercise');
    const coach = coachEl?.value.trim();
    const ex    = exEl?.value.trim();
    if (!coach)             { shakeEl(coachEl); toast('⚠️ יש להזין שם מדריך');   haptic('warning'); return false; }
    if (!ex)                { shakeEl(exEl);    toast('⚠️ יש להזין שם תרגיל'); haptic('warning'); return false; }
    if (!S.form.team)       { shakeEl(document.querySelector('.segment-wrap')); toast('⚠️ יש לבחור צוות');     haptic('warning'); return false; }
    if (!S.form.terrainType){ shakeEl(document.querySelector('.terrain-grid')); toast('⚠️ יש לבחור תא שטח');   haptic('warning'); return false; }
    S.form.coachName = coach; S.form.exerciseName = ex;
    S.form.date = document.getElementById('f-date')?.value || S.form.date;
  }
  if (S.step === 2) {
    const allCriteria = [
      ...Object.values(UNIVERSAL).flat(),
      ...(TERRAIN_CRITERIA[S.form.terrainType] || []),
    ];
    const missing = allCriteria.find(c => !(S.form.scores[c] > 0));
    if (missing) {
      const row = document.querySelector(`[data-crit="${missing}"]`);
      shakeEl(row || document.querySelector('.criterion-row'));
      toast(`⚠️ יש לדרג: ${missing}`);
      haptic('warning');
      return false;
    }
  }
  return true;
}

// ============================================================
// INIT
// ============================================================
loadData();
